name: Scheduled Cloud End-to-end Tests

on:
  schedule:
    - cron: '0 6 * * *' # Daily at 06:00 UTC
  workflow_dispatch:

# Reusable workflows can only narrow caller permissions, not escalate.
# `id-token: write` is needed by the Vault OIDC step in playwright-cloud.yml.
permissions:
  contents: read
  id-token: write

jobs:
  playwright-cloud:
    name: Playwright (Cloud)
    uses: grafana/data-sources-ci-workflows/.github/workflows/playwright-cloud.yml@main
    secrets: inherit
    permissions:
      contents: read
      id-token: write
    with:
      run-stage: nightly
      pdc-network-name: datasources-pdc-network-gcp-datasourcese2e
      repo-secrets: |
        DS_INSTANCE_CLIENT_EMAIL=bigQueryJwt:json_clientEmail
        DS_INSTANCE_PROJECT_ID=bigQueryJwt:json_defaultProject
        DS_INSTANCE_TOKEN_URI=bigQueryJwt:json_tokenUri
        DS_INSTANCE_PRIVATE_KEY=bigQueryJwt:secure_privateKey

  notify-slack:
    name: Notify Slack on failure
    needs: playwright-cloud
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Notify #grafana-ds-plugins-dev
        uses: grafana/shared-workflows/actions/send-slack-message@551bc8d50017d3e95d5da3f8a4826e733a208dc0 # send-slack-message/v3.0.2
        with:
          method: chat.postMessage
          payload: |
            {
              "channel": "C0APH909GFK",
              "text": "Cloud E2E tests failed for ${{ github.repository }} (nightly)",
              "blocks": [
                { "type": "section", "text": { "type": "mrkdwn", "text": ":x: *Cloud E2E tests failed*" } },
                { "type": "section", "fields": [
                  { "type": "mrkdwn", "text": "*Repository:*\n${{ github.repository }}" },
                  { "type": "mrkdwn", "text": "*Branch:*\n${{ github.ref_name }}" },
                  { "type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }}" },
                  { "type": "mrkdwn", "text": "*Commit:*\n${{ github.sha }}" }
                ] },
                { "type": "section", "text": { "type": "mrkdwn", "text": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View the failed run>" } }
              ]
            }
